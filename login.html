<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO META -->
  <title>Store - Login / Sign Up</title>
  <meta name="description" content="Login or sign up to Store. Secure authentication for customers and admins.">
  <meta name="keywords" content="Store login, signup, ecommerce login, admin login">
  <meta name="author" content="Store">

  <!-- CSS -->
  <link rel="stylesheet" href="login.css">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <!-- 🌊 BACKGROUND SECTION -->
  <section class="login-bg-section"></section>

  <!-- 🔷 LOGO SECTION -->
  <section class="login-logo-section">
    <h1 class="login-logo-text">Store</h1>
  </section>

  <!-- 🔐 AUTH SECTION -->
  <section class="login-auth-section">

    <div class="login-auth-box">

      <!-- 🟢 SIGN UP -->
      <div class="login-signup-container" id="login-signup-container">

        <h2 class="login-title">Create Account</h2>

        <form id="login-signup-form">

          <input type="email" id="signup-email-input" class="login-input" placeholder="Email Address" required>

          <input type="password" id="signup-password-input" class="login-input" placeholder="Password" required>

          <button type="submit" id="signup-submit-btn" class="login-btn">
            Sign Up
          </button>

        </form>

        <p class="login-switch-text">
          Already have an account?
          <span class="login-switch-link" id="go-to-login">Login</span>
        </p>

      </div>

      <!-- 🔵 LOGIN -->
      <div class="login-login-container" id="login-login-container">

        <h2 class="login-title">Welcome Back</h2>

        <form id="login-login-form">

          <input type="email" id="login-email-input" class="login-input" placeholder="Email Address" required>

          <input type="password" id="login-password-input" class="login-input" placeholder="Password" required>

          <button type="submit" id="login-submit-btn" class="login-btn">
            Login
          </button>

        </form>

        <p class="login-switch-text">
          Don't have an account?
          <span class="login-switch-link" id="go-to-signup">Sign Up</span>
        </p>

      </div>

    </div>

  </section>

  <!-- 📄 FOOTER SECTION -->
  <section class="login-footer-section">
    <p class="login-footer-text">© 2026 Store. All rights reserved.</p>
  </section>
<script type="module" src="js/login.js"></script>
</body>
</html>
