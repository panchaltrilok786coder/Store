<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store - Login</title>

  <link rel="stylesheet" href="login.css" />
</head>

<body>

  <!-- 🌊 BACKGROUND -->
  <section class="bg-layer"></section>

  <!-- 🏷️ LOGO -->
  <header class="top-logo">
    <h1 class="logo-text">Store</h1>
  </header>

  <!-- 🔐 AUTH CONTAINER -->
  <main class="auth-wrapper">

    <!-- LOGIN -->
    <section id="login-box" class="auth-box">

      <h2>Login</h2>

      <input type="email" id="login-email" placeholder="Email" class="input" />
      <input type="password" id="login-password" placeholder="Password" class="input" />

      <button id="login-btn" class="btn">Login</button>

      <p class="switch">
        Don’t have an account?
        <span id="to-signup">Sign Up</span>
      </p>

    </section>

    <!-- SIGNUP -->
    <section id="signup-box" class="auth-box hidden">

      <h2>Sign Up</h2>

      <input type="email" id="signup-email" placeholder="Email" class="input" />
      <input type="password" id="signup-password" placeholder="Password" class="input" />

      <button id="signup-btn" class="btn">Create Account</button>

      <p class="switch">
        Already have an account?
        <span id="to-login">Login</span>
      </p>

    </section>
    
  <!-- GOOGLE AUTH -->
  <div class="google-auth">
    <button id="googleSignInBtn">
      <!-- Official Google "G" SVG -->
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.73 1.22 9.24 3.61l6.91-6.91C35.98 2.09 30.4 0 24 0 14.64 0 6.56 5.4 2.64 13.26l8.06 6.26C12.58 13.06 17.82 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.55c0-1.63-.15-3.2-.43-4.7H24v9h12.4c-.54 2.9-2.18 5.36-4.64 7.04l7.19 5.6C43.98 36.9 46.1 31.18 46.1 24.55z"/>
        <path fill="#FBBC05" d="M10.7 28.52a14.5 14.5 0 010-9.04l-8.06-6.26A23.93 23.93 0 000 24c0 3.77.9 7.34 2.64 10.74l8.06-6.22z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.92-2.13 15.89-5.81l-7.19-5.6c-2 1.35-4.55 2.15-8.7 2.15-6.18 0-11.42-3.56-13.3-8.72l-8.06 6.22C6.56 42.6 14.64 48 24 48z"/>
      </svg>

      Continue with Google
    </button>
  </div>

  </main>

  <!-- 🔄 LOADING OVERLAY -->
  <div id="loading" class="loading hidden">
    <div class="spinner">Loading...</div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
