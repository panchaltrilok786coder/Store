<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Login</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="bg"></div>

  <div class="login-container">

    <!-- LOGO -->
    <div class="logo">
      🛒 STORE
    </div>

    <h2 id="form-title">Login</h2>

    <div id="error-box"></div>

    <input id="login-email-input" type="email" placeholder="Email">

    <div class="password-box">
      <input id="login-password-input" type="password" placeholder="Password">
      <button id="toggle-password">👁</button>
    </div>

    <button id="login-submit-btn">Login</button>

    <p id="loading-text" class="hidden">Processing...</p>

    <p class="switch-text">
      <span id="switch-mode">Create account</span>
    </p>

  </div>

  <script type="module" src="./login.js"></script>

</body>
</html>
