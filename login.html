<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store - Login</title>

  <link rel="stylesheet" href="login.css" />
</head>

<body>

  <!-- 🌊 BACKGROUND -->
  <section class="bg-layer"></section>

  <!-- 🏷️ LOGO -->
  <header class="top-logo">
    <h1 class="logo-text">Store</h1>
  </header>

  <!-- 🔐 AUTH CONTAINER -->
  <main class="auth-wrapper">

    <!-- LOGIN -->
    <section id="login-box" class="auth-box">

      <h2>Login</h2>

      <input type="email" id="login-email" placeholder="Email" class="input" />
      <input type="password" id="login-password" placeholder="Password" class="input" />

      <button id="login-btn" class="btn">Login</button>

      <p class="switch">
        Don’t have an account?
        <span id="to-signup">Sign Up</span>
      </p>

    </section>

    <!-- SIGNUP -->
    <section id="signup-box" class="auth-box hidden">

      <h2>Sign Up</h2>

      <input type="email" id="signup-email" placeholder="Email" class="input" />
      <input type="password" id="signup-password" placeholder="Password" class="input" />

      <button id="signup-btn" class="btn">Create Account</button>

      <p class="switch">
        Already have an account?
        <span id="to-login">Login</span>
      </p>

    </section>
    
    <!-- GOOGLE SIGNUP -->
      <section class="google-auth-section">

        <button id="google-signup-btn" class="google-btn">

          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 48 48"
               class="google-icon">

            <path fill="#FFC107"
              d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>

            <path fill="#FF3D00"
              d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>

            <path fill="#4CAF50"
              d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.2-8l-6.5 5C9.6 39.5 16.3 44 24 44z"/>

            <path fill="#1976D2"
              d="M43.6 20.5H42V20H24v8h11.3c-1.1 3-3.4 5.4-6.5 6.8l6.2 5.2C39.6 36.1 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"/>

          </svg>

          <span>Sign up with Google</span>

        </button>

      </section>

  </main>

  <!-- 🔄 LOADING OVERLAY -->
  <div id="loading" class="loading hidden">
    <div class="spinner">Loading...</div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
