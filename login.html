<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="bg"></div>

  <div class="login-container">

    <h2 id="form-title">Login</h2>

    <!-- ERROR BOX -->
    <div id="error-box"></div>

    <!-- EMAIL -->
    <input id="login-email-input" type="email" placeholder="Email">

    <!-- PASSWORD WRAPPER -->
    <div class="password-box">
      <input id="login-password-input" type="password" placeholder="Password">
      <button id="toggle-password">👁</button>
    </div>

    <!-- BUTTON -->
    <button id="login-submit-btn">Login</button>

    <!-- LOADING -->
    <p id="loading-text" class="hidden">Processing...</p>

    <!-- SWITCH -->
    <p class="switch-text">
      <span id="switch-mode">Create account</span>
    </p>

  </div>

  <script type="module" src="./login.js"></script>

</body>
</html>
