<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Admin - Orders Dashboard</title>

  <!-- SEO -->
  <meta name="description" content="Manage all customer orders, track status, and monitor sales performance">
  <meta name="keywords" content="admin orders, ecommerce orders, order management dashboard">

  <!-- CSS -->
  <link rel="stylesheet" href="adminOrders.css">

  <!-- JS -->
  <script type="module" src="js/adminOrders.js" defer></script>
</head>

<body>

  <!-- BACKGROUND -->
  <section class="admin-bg-section"></section>

  <!-- NAVBAR -->
  <header class="admin-navbar">

    <div class="admin-logo-section">
      <h1 class="admin-logo-text">Orders Panel</h1>
    </div>

    <nav class="admin-nav-links">
      <a href="./admin.html" class="admin-nav-link">Dashboard</a>
      <a href="./admin.html#products" class="admin-nav-link">Products</a>
      <a href="./adminOrders.html" class="admin-nav-link">Orders</a>
      <a href="./admin.html#users" class="admin-nav-link">Users</a>
    </nav>

    <button id="admin-logout-btn" class="admin-logout-btn">
      Logout
    </button>

  </header>

  <!-- MAIN -->
  <main class="admin-main">

    <!-- SUMMARY CARDS -->
    <section class="admin-section">

      <h2 class="admin-section-title">Order Overview</h2>

      <div class="admin-card-grid">

        <div class="admin-card">
          <h3>Total Orders</h3>
          <p id="total-orders">0</p>
        </div>

        <div class="admin-card">
          <h3>Today's Orders</h3>
          <p id="today-orders">0</p>
        </div>

        <div class="admin-card">
          <h3>Total Revenue</h3>
          <p id="total-revenue">₹0</p>
        </div>

      </div>

    </section>

    <!-- FILTERS (UI ONLY) -->
    <section class="admin-section">

      <h2 class="admin-section-title">Filters</h2>

      <div class="order-filters">

        <button class="filter-btn">All</button>
        <button class="filter-btn">Pending</button>
        <button class="filter-btn">Shipped</button>
        <button class="filter-btn">Delivered</button>

      </div>

    </section>

    <!-- ORDERS LIST -->
    <section class="admin-section">

      <h2 class="admin-section-title">All Orders</h2>

      <div id="admin-orders-list" class="orders-list"></div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="admin-footer">
    <p>© 2026 Store Admin Orders System</p>
  </footer>

</body>

</html>
