<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Store Product Details Page" />

  <title>Product - Store</title>

  <link rel="stylesheet" href="product.css" />
  <script type="module" src="js/product.js" defer></script>
</head>

<body>

  
  <!-- ================= NAVBAR ================= -->
 <header class="home-navbar">

  <!-- ROW 1: LOGO -->
  <div class="home-navbar-top">
    <h1 class="home-logo">STORE</h1>
  </div>

  <!-- ROW 2: SEARCH + ACTIONS -->
  <div class="home-navbar-bottom">

    <input
      type="text"
      id="home-search-input"
      class="home-search-input"
      placeholder="Search products..."
    />

    <div class="home-nav-actions">
      <button id="home-cart-btn" class="home-btn-nav">Cart</button>
      <button id="home-orders-btn"  class="home-btn-nav">Orders</button>
      <button id="home-logout-btn" class="home-btn-nav">Logout</button>
    </div>

  </div>

</header>


  <!-- ================= PRODUCT DETAILS ================= -->
  <main class="product-main">

    <section class="product-details-card">

      <img id="product-image" />

      <div class="product-info">

        <h2 id="product-name"></h2>

        <p id="product-price"></p>

        <p id="product-description">
          No description available
        </p>

        <button id="add-to-cart-btn">Add to Cart</button>

      </div>

    </section>

    <!-- ================= RELATED PRODUCTS ================= -->
    <section class="related-section">

      <h3>Related Products</h3>

      <div id="related-products" class="related-grid"></div>

    </section>

  </main>

</body>

</html>
