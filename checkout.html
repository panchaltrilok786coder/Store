<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Secure checkout page to place your order. Review your cart, enter delivery details, and complete your purchase easily." />
  <meta name="keywords" content="checkout, order, ecommerce, cart, payment, store" />
  <meta name="author" content="Store" />

  <title>Checkout | Store</title>

  <link rel="stylesheet" href="checkout.css" />
  <script type="module" src="js/checkout.js" defer></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="checkout-header">
    <h1 class="checkout-logo">STORE</h1>
  </header>
    <!-- BACK LINK -->
    <nav class="checkout-nav">
      <a href="./cart.html" class="checkout-back-link">← Back to Cart</a>
    </nav>

//==========≠========= Checkout Main ==========∞==============
  <main class="checkout-main">

  <!-- ORDER SUMMARY -->
  <section class="checkout-section checkout-summary">
    <h2>Order Summary</h2>
    <div id="checkout-items"></div>

    <p class="checkout-total">
      Total: ₹<span id="checkout-total">0</span>
    </p>
  </section>

  <!-- SAVED ADDRESSES -->
  <section class="checkout-section">
    <h2>Select Delivery Address</h2>

    <div id="saved-addresses" class="saved-addresses"></div>

    <button
      type="button"
      id="show-address-form-btn"
      class="secondary-btn">
      + Add New Address
    </button>
  </section>

  <!-- ADDRESS FORM -->
  <section
    id="address-form-section"
    class="checkout-section hidden">

    <h2>Add New Address</h2>

    <form id="checkout-form" class="checkout-form">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" type="text" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" required>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" required></textarea>
      </div>

    </form>
  </section>

  <!-- PAYMENT METHOD -->
  <section class="checkout-section">
    <h2>Payment Method</h2>

    <div class="payment-options">

      <label class="payment-card">
        <input
          type="radio"
          name="payment"
          value="cod"
          checked>
        <span>Cash on Delivery</span>
      </label>

      <label class="payment-card">
        <input
          type="radio"
          name="payment"
          value="razorpay">
        <span>Online Payment</span>
      </label>

    </div>
  </section>

  <!-- FINAL BUTTON -->
  <section class="checkout-section">
    <button id="place-order-btn" class="checkout-btn">
      Place Order
    </button>
  </section>

</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
