<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Secure checkout page to place your order. Review your cart, enter delivery details, and complete your purchase easily." />
  <meta name="keywords" content="checkout, order, ecommerce, cart, payment, store" />
  <meta name="author" content="Store" />

  <title>Checkout | Store</title>

  <link rel="stylesheet" href="checkout.css" />
  <script type="module" src="js/checkout.js" defer></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="checkout-header">
    <h1 class="checkout-logo">STORE</h1>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="checkout-main">

    <!-- BACK LINK -->
    <nav class="checkout-nav">
      <a href="./cart.html" class="checkout-back-link">← Back to Cart</a>
    </nav>

    <!-- ORDER SUMMARY -->
    <section class="checkout-section checkout-summary">
      <h2>Order Summary</h2>

      <div id="checkout-items" class="checkout-items"></div>

      <p class="checkout-total">
        Total: ₹<span id="checkout-total">0</span>
      </p>
    </section>

    <!-- ADDRESS FORM -->
    <section class="checkout-section checkout-address">
      <h2>Delivery Details</h2>

      <form id="checkout-form" class="checkout-form">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" required placeholder="Enter your name" />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" required placeholder="Enter phone number" />
        </div>

        <div class="form-group">
          <label for="address">Full Address</label>
          <textarea id="address" required placeholder="Enter full delivery address"></textarea>
        </div>

        <button type="submit" class="checkout-btn">
          Place Order
        </button>

      </form>
    </section>

  </main>

</body>
</html>
