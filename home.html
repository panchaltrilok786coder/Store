<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <meta name="description" content="Store - Discover and shop amazing products at best prices" />
  <meta name="keywords" content="store, ecommerce, shopping, products" />

  <title>Store - Home</title>

  <link rel="stylesheet" href="home.css" />
  <script type="module" src="js/home.js" defer></script>
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <header class="home-navbar">

    <div class="home-logo-section">
      <h1 class="home-logo">STORE</h1>
    </div>

    <nav class="home-nav">

      <input
        type="text"
        id="home-search-input"
        class="home-search-input"
        placeholder="Search products..."
      />

      <div class="home-nav-actions">
        <button id="home-cart-btn" class="home-btn-nav">Cart</button>
        <button id="home-orders-btn" class="home-btn-nav">Orders</button>
        <button id="home-logout-btn" class="home-btn-nav">Logout</button>
      </div>

    </nav>

  </header>

  <!-- ================= HERO ================= -->
  <section class="home-hero">

    <div class="home-hero-content">
      <h2>Discover Products You Love</h2>
      <p>Best deals. Best prices. Best experience.</p>
      <button class="home-hero-btn">Browse Products</button>
    </div>

  </section>

  <!-- ================= PRODUCTS ================= -->
  <main class="home-main">

    <section class="home-products-section">

      <header class="home-section-header">
        <h2 class="home-section-title">All Products</h2>
      </header>

      <div id="home-products-grid" class="home-products-grid"></div>

    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="home-footer">
    <p>© 2026 Store. All rights reserved.</p>
  </footer>

</body>

</html>
