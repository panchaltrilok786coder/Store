<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your Cart - Store" />

  <title>Cart - Store</title>

  <link rel="stylesheet" href="cart.css" />
  <script type="module" src="js/cart.js" defer></script>
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <header class="cart-navbar">

    <div class="cart-navbar-top">
      <h1 class="cart-logo">STORE</h1>
    </div>

    <div class="cart-navbar-bottom">
      <input type="text" class="cart-search" placeholder="Search..." />

      <nav class="cart-nav-actions">
        <button id="home-btn">Home</button>
        <button id="orders-btn">Orders</button>
        <button id="logout-btn">Logout</button>
      </nav>
    </div>

  </header>

  <!-- ================= MAIN ================= -->
  <main class="cart-main">

    <section class="cart-header">
      <h2>Your Cart</h2>
    </section>

    <!-- CART LIST -->
    <section id="cart-list" class="cart-list"></section>

    <!-- EMPTY STATE -->
    <section id="cart-empty" class="cart-empty hidden">
      <p>Your cart is empty</p>
      <button id="go-home-btn">Start Shopping</button>
    </section>

    <!-- TOTAL -->
    <section class="cart-summary">
      <h3 id="cart-delivery-fee"></h3>
      <h3 id="cart-total">Total: ₹0</h3>
      <button id="checkout-btn" class="checkout-btn">Checkout</button>
    </section>

  </main>

</body>
</html>
